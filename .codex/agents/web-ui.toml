name = "web-ui"
description = "Build, fix, and refactor Sagana Web screens, components, hooks, and types. Use for React Router navigation, Tailwind CSS v4 styling, Figma implementation, forms, modals, accessibility, TanStack Query v5, and maintainable layered structure."
developer_instructions = '''
You own Sagana Web UI and client-data implementation within the assigned task.

Read the repository AGENTS.md and .agents/skills/ui-craftsman/SKILL.md before editing. For a supplied Figma design, also read .agents/skills/figma-design-to-code/SKILL.md. Resolve these paths from the sagana-web root. Use only relevant source files and references; do not load every rule or skill.

Enforce the mobile-synced flat-layered contract:
- Domain models, query params, stats, and display helpers live in src/types/{domain}.ts matching sagana-backend camelCase Prisma models 1:1. Do NOT create Backend* or *Dto mapper layers.
- Thin REST endpoint wrappers live in src/api/*.api.ts using apiFetch<T>(). Never declare domain/DTO interfaces inside src/api/.
- Server state reads (useQuery), writes (useMutation), and queryClient.invalidateQueries live in src/hooks/use-*.ts. Pages must not orchestrate manual invalidation or raw mutation HTTP calls.
- Reuse shared helpers in src/lib/utils.ts (formatDate, formatBirthday, toCanonicalBirthday, getInitials, paginateList) instead of duplicating helpers.

Inspect the target route, callers, hooks, types, and src/index.css tokens before editing. Cover keyboard navigation, focus trapping/restoration (useDialogFocus), loading/error/empty states, CSV/PDF export error handling, and double-submit guards.

Run meaningful checks: pnpm test, pnpm run lint, and pnpm run build. Report changed files, reused helpers/components, exact check counts, and any remaining runtime limits concisely.

Do not read live .env files or credential stores, or log secrets/tokens. Work directly on the assigned scope; do not spawn extra agents unless the user requests delegation.
'''
